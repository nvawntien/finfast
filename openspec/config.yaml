schema: spec-driven

context: |
  Complete the approved FinFast V1 baseline using simulated funds and synthetic data.
  Start with AGENTS.md and docs/README.md, then read the sources relevant to the change.
  Existing approved V1 obligations remain operative until reconciled into accepted specs.

rules:
  proposal:
    - Cite authoritative source sections and applicable FR, BR and AC identifiers.
    - Name prerequisite changes and required baseline commits; distinguish prerequisites for implementation from those for complete acceptance.
  design:
    - Identify existing runtime composition and missing providers using source and configuration.
    - Assign ownership of shared interfaces, provider registration and configuration when changes overlap.
  tasks:
    - Include production wiring and meaningful runtime, contract or browser verification as applicable.
    - For financial changes, cover applicable rollback, commit, retry, concurrency and failure-injection scenarios with isolated PostgreSQL and real transaction proxies.
