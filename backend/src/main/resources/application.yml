spring:
  application:
    name: finfast-backend
    version: ${DEPLOYMENT_VERSION:dev}
  main:
    banner-mode: "off"
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: false

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS'Z',UTC} %clr(%-5level) %clr([%module]){cyan} finfast-backend/${DEPLOYMENT_VERSION:dev}@${APP_ENV:local} %logger{40} trace=%trace - %msg%n%safeEx"
  structured:
    ecs:
      service:
        name: finfast-backend
        version: ${DEPLOYMENT_VERSION:dev}
        environment: ${APP_ENV:local}
    json:
      context:
        include: false
      exclude: error.message
      customizer: com.finfast.common.logging.LoggingJsonCustomizer
      stacktrace:
        printer: com.finfast.common.logging.SafeThrowablePrinter
