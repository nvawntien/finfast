name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
      - name: Verify Java, Wrapper and isolated Docker test prerequisites
        run: |
          java -XshowSettings:properties -version 2>&1 | grep 'java.specification.version = 21$'
          test -x ./mvnw
          ./mvnw --version
          docker version
          # CI never loads a developer environment or starts the persistent Compose DB.
          test ! -e ../.env
          test ! -e .env
      - name: Run full suite including ArchUnit and PostgreSQL Testcontainers
        run: ./mvnw --batch-mode --no-transfer-progress test

  backend-package:
    name: backend-package
    needs: backend-tests
    # Fail the gate after failed tests, while allowing superseded runs to cancel.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Require successful full test suite before packaging
        working-directory: .
        env:
          TEST_RESULT: ${{ needs.backend-tests.result }}
        run: test "$TEST_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
      - name: Verify Java and executable Wrapper
        run: |
          java -XshowSettings:properties -version 2>&1 | grep 'java.specification.version = 21$'
          test -x ./mvnw
          ./mvnw --version
      - name: Package executable JAR after successful tests
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify executable packaging and test code isolation
        run: python3 ../scripts/check_backend_jar.py

  docs-validation:
    name: docs-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt
      - name: Install pinned documentation tools
        run: python -m pip install -r scripts/requirements-docs.txt
      - name: Validate OpenAPI syntax and schema
        run: python -m openapi_spec_validator docs/03-design/contracts/openapi-v1.yaml
      - name: Check local Markdown links and all OpenAPI references
        run: python scripts/check_docs.py
      - name: Validate documentation Compose configuration
        run: docker compose -f compose.docs.yaml config --quiet
